name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin'
            name: 'macOS-arm64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            rust_targets: 'x86_64-apple-darwin'
            name: 'macOS-x64'
          - platform: 'windows-latest'
            args: ''
            rust_targets: ''
            name: 'Windows-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: release-${{ matrix.name }}

      - name: Install dependencies
        run: pnpm install

      # secrets コンテキストはステップの if: からは参照できない。
      # 後続ステップが分岐できるよう、ここで env に落としておく。
      - name: Detect macOS signing mode
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          if [ "$HAS_CERT" = "true" ]; then
            echo "SIGN_MODE=developer-id" >> "$GITHUB_ENV"
          else
            echo "SIGN_MODE=adhoc" >> "$GITHUB_ENV"
            echo "::warning::APPLE_CERTIFICATE is not set. Falling back to ad-hoc signing (not notarized)."
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing / notarization.
          #
          # 二段構えにしてある。APPLE_CERTIFICATE が設定されていれば Developer ID で
          # 署名し公証まで通す。無ければ従来どおりアドホック署名に落ちる。
          #
          # なぜ落とせるようにするか: fork からのビルドと、証明書の期限切れ・失効時に
          # リリース全体が落ちるのを避けるため。署名が弱くなるだけで、成果物は出る。
          # アドホックでも「右クリック → 開く」で起動はできる（警告は出る）。
          #
          # Tauri CLI v2 が中でやること:
          #   1. .p12 を一時キーチェーンへ取り込む
          #   2. hardened runtime 付きで codesign する（公証の必須要件）
          #   3. notarytool へ投げて結果を待つ
          #   4. stapler で公証チケットを .app と .dmg に貼る
          # 手で codesign / notarytool を呼ぶ必要はない。
          #
          # APPLE_PASSWORD は Apple Account のパスワードではなく
          # app-specific password。通常のパスワードでは notarytool が弾く。
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          # 証明書が無いときは '-'（アドホック）へ落とす
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && (secrets.APPLE_SIGNING_IDENTITY || '-') || '' }}
          # 公証の資格情報は、証明書があるときだけ渡す。
          # アドホック署名のまま公証へ投げると必ず失敗するため。
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_TEAM_ID || '' }}
        with:
          # タグ push のときだけリリースを作る。
          # 手動実行（workflow_dispatch）は公証の検証用で、tagName を空にすると
          # tauri-action はビルドだけしてリリースに触らない。ここにブランチ名が
          # 入ると "Glimpse main" のような下書きリリースができてしまう。
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: 'Glimpse ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download the installer for your platform.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # 公証が本当に通ったかを確かめる。
      #
      # codesign が成功しても公証が走っていないことがあり、その差は
      # 「そのアプリを一度も見たことのない Mac」でしか現れない。手元では
      # 気づけないので、CI で確定させる。ここを省くと、配布してから
      # 「開けない」と言われて初めて分かる。
      - name: Verify notarization
        if: matrix.platform == 'macos-latest' && env.SIGN_MODE == 'developer-id'
        shell: bash
        run: |
          set -euo pipefail

          app=$(find src-tauri/target -type d -name '*.app' -print -quit)
          if [ -z "$app" ]; then
            echo "::error::No .app bundle found under src-tauri/target"
            exit 1
          fi
          echo "Found: $app"

          echo "--- codesign ---"
          codesign -dv --verbose=4 "$app" 2>&1

          # hardened runtime が付いていないと公証は通らない。
          # 通ったように見えて実は未公証、という状態を弾く。
          codesign -dv "$app" 2>&1 | grep -q 'flags=.*runtime' \
            || { echo "::error::Hardened runtime is not enabled"; exit 1; }

          echo "--- stapler ---"
          xcrun stapler validate "$app"

          # Gatekeeper の判定。公証済みなら source=Notarized Developer ID になる。
          echo "--- spctl ---"
          spctl -a -vvv -t install "$app"

          dmg=$(find src-tauri/target -type f -name '*.dmg' -print -quit)
          if [ -n "$dmg" ]; then
            echo "--- stapler (dmg) ---"
            xcrun stapler validate "$dmg"
          fi

      # 手動実行ではリリースが無いので、公証済みの .dmg を成果物として残す。
      # 一度も Glimpse を開いたことのない Mac で開けるかを人が確かめるため。
      - name: Upload notarized dmg
        if: github.event_name == 'workflow_dispatch' && matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: glimpse-${{ matrix.name }}-dmg
          path: src-tauri/target/**/*.dmg
          if-no-files-found: error
          retention-days: 7
