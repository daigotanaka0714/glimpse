name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a draft release for v<version in tauri.conf.json>'
        type: boolean
        default: false

# release=true runs get their own group and are never cancelled: cancelling one
# mid-upload leaves a half-filled draft behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: ${{ !inputs.release }}

jobs:
  # Decides the tag the build uploads to. Empty means build only.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      # Draft releases are listed only for tokens with push access.
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          RELEASE: ${{ inputs.release }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "push" ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$RELEASE" != "true" ]; then
            echo "Build only (release=false)."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag="v$version"
          echo "Tag: $tag"

          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>err.txt; then
            echo "::error::Tag $tag already exists. Bump the version in src-tauri/tauri.conf.json."
            exit 1
          elif ! grep -q 'HTTP 404' err.txt; then
            cat err.txt
            echo "::error::Could not check whether tag $tag exists."
            exit 1
          fi

          ids=$(gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | .html_url")
          if [ -n "$ids" ]; then
            echo "$ids"
            echo "::error::A release for $tag already exists (draft or published). Delete the draft or bump the version."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin'
            name: 'macOS-arm64'
            fixed_asset: 'Glimpse_macos_arm64.dmg'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            rust_targets: 'x86_64-apple-darwin'
            name: 'macOS-x64'
            fixed_asset: 'Glimpse_macos_x64.dmg'
          - platform: 'windows-latest'
            args: ''
            rust_targets: ''
            name: 'Windows-x64'
            fixed_asset: 'Glimpse_windows_x64-setup.exe'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: release-${{ matrix.name }}

      - name: Install dependencies
        run: pnpm install

      # secrets コンテキストはステップの if: からは参照できない。
      # 後続ステップが分岐できるよう、ここで env に落としておく。
      - name: Detect macOS signing mode
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          if [ "$HAS_CERT" = "true" ]; then
            echo "SIGN_MODE=developer-id" >> "$GITHUB_ENV"
          else
            echo "SIGN_MODE=adhoc" >> "$GITHUB_ENV"
            echo "::warning::APPLE_CERTIFICATE is not set. Falling back to ad-hoc signing (not notarized)."
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing / notarization.
          #
          # 二段構えにしてある。APPLE_CERTIFICATE が設定されていれば Developer ID で
          # 署名し公証まで通す。無ければ従来どおりアドホック署名に落ちる。
          #
          # なぜ落とせるようにするか: fork からのビルドと、証明書の期限切れ・失効時に
          # リリース全体が落ちるのを避けるため。署名が弱くなるだけで、成果物は出る。
          # アドホックでも「右クリック → 開く」で起動はできる（警告は出る）。
          #
          # Tauri CLI v2 が中でやること:
          #   1. .p12 を一時キーチェーンへ取り込む
          #   2. hardened runtime 付きで codesign する（公証の必須要件）
          #   3. notarytool へ投げて結果を待つ
          #   4. stapler で公証チケットを .app と .dmg に貼る
          # 手で codesign / notarytool を呼ぶ必要はない。
          #
          # APPLE_PASSWORD は Apple Account のパスワードではなく
          # app-specific password。通常のパスワードでは notarytool が弾く。
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          # 証明書が無いときは '-'（アドホック）へ落とす
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && (secrets.APPLE_SIGNING_IDENTITY || '-') || '' }}
          # 公証の資格情報は、証明書があるときだけ渡す。
          # アドホック署名のまま公証へ投げると必ず失敗するため。
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_TEAM_ID || '' }}
        with:
          # Empty tagName makes tauri-action build without creating or uploading to a release.
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'Glimpse ${{ needs.prepare.outputs.tag }}'
          releaseBody: 'See the assets below to download the installer for your platform.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # 公証が本当に通ったかを確かめる。
      #
      # codesign が成功しても公証が走っていないことがあり、その差は
      # 「そのアプリを一度も見たことのない Mac」でしか現れない。手元では
      # 気づけないので、CI で確定させる。ここを省くと、配布してから
      # 「開けない」と言われて初めて分かる。
      - name: Verify notarization
        if: matrix.platform == 'macos-latest' && env.SIGN_MODE == 'developer-id'
        shell: bash
        run: |
          set -euo pipefail

          app=$(find src-tauri/target -type d -name '*.app' -print -quit)
          if [ -z "$app" ]; then
            echo "::error::No .app bundle found under src-tauri/target"
            exit 1
          fi
          echo "Found: $app"

          echo "--- codesign ---"
          codesign -dv --verbose=4 "$app" 2>&1

          # hardened runtime が付いていないと公証は通らない。
          # 通ったように見えて実は未公証、という状態を弾く。
          codesign -dv "$app" 2>&1 | grep -q 'flags=.*runtime' \
            || { echo "::error::Hardened runtime is not enabled"; exit 1; }

          echo "--- stapler ---"
          xcrun stapler validate "$app"

          # Gatekeeper の判定。公証済みなら source=Notarized Developer ID になる。
          echo "--- spctl ---"
          spctl -a -vvv -t install "$app"

          dmg=$(find src-tauri/target -type f -name '*.dmg' -print -quit)
          if [ -n "$dmg" ]; then
            echo "--- stapler (dmg) ---"
            xcrun stapler validate "$dmg"
          fi

      # Same installer under a version-independent name, so that
      # https://github.com/<repo>/releases/latest/download/<fixed_asset>
      # always serves the latest published release.
      - name: Attach installer under a fixed name
        if: needs.prepare.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          FIXED: ${{ matrix.fixed_asset }}
          RUST_TARGET: ${{ matrix.rust_targets }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          case "$FIXED" in
            *.exe) pattern="*/nsis/*_${version}_*-setup.exe" ;;
            *.dmg) pattern="*/dmg/*_${version}_*.dmg" ;;
            *) echo "::error::Unknown asset type: $FIXED"; exit 1 ;;
          esac

          # Written for the bash 3.2 that macOS ships (no mapfile).
          bundle="src-tauri/target/${RUST_TARGET:+$RUST_TARGET/}release/bundle"
          found=$(find "$bundle" -type f -path "$pattern")
          count=$(printf '%s' "$found" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "$found"
            echo "::error::Expected exactly one file matching $pattern, found $count"
            exit 1
          fi
          echo "Found: $found"

          cp "$found" "$FIXED"
          gh release upload "$TAG" "$FIXED" --clobber -R "$GITHUB_REPOSITORY"
