[package]
name = "glimpse"
version = "0.4.1"
description = "High-speed photo checker for stage photography"
authors = ["Daigo"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "glimpse_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 画像処理
image = { version = "0.25", features = ["jpeg", "png"] }
rawloader = "0.37"
imagepipe = "0.5"

# 非同期・並列処理
tokio = { version = "1", features = ["full"] }
rayon = "1.10"

# データベース
rusqlite = { version = "0.32", features = ["bundled"] }

# EXIF情報
kamadak-exif = "0.5"

# ユーティリティ
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
walkdir = "2"
thiserror = "2"
tauri-plugin-shell = "2.3.4"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# ============================================================
# 開発プロファイル: target のディスク使用量とビルド時間を優先
# 参考: https://doc.rust-lang.org/cargo/guide/build-performance.html
#
# macOS では split-debuginfo = "unpacked" が既定のため、デバッグ情報は
# .o ファイル側に載る。target を小さくする唯一の有効手段は
# 「そもそも debuginfo を生成しない」こと。
# ============================================================
[profile.dev]
# 自分のコード: 行番号とバックトレースは残す（変数の中身は見えなくなる）
debug = "line-tables-only"

[profile.dev.package."*"]
# 依存クレート（数百個）の debuginfo を全カット ← target 削減の本命
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

# 本気でデバッガを使うときだけ: cargo run --profile debugging
# 使い終わったら cargo clean --profile debugging でディスクを戻すこと
[profile.debugging]
inherits = "dev"
debug = true

# ============================================================
# リリース: Tauri v2 公式推奨 https://v2.tauri.app/concept/size/
# ============================================================
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
